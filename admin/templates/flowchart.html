{% extends "base.html" %}
{% block title %}Operations — ArgusReach Admin{% endblock %}
{% block content %}
{% if inline_body %}
  <style>{{ inline_styles | safe }}</style>
  {{ inline_body | safe }}
{% else %}
  {# Fallback: iframe if inline render fails #}
  <iframe src="{{ url_for('flowchart_data') }}"
    style="width:100%;height:calc(100vh - 80px);border:1px solid #2d3448;border-radius:10px;background:#0f0f0f"
    frameborder="0">
  </iframe>
{% endif %}
{% endblock %}
